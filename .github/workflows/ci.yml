name: Source and security CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22', '24']
    # Keep all nine OS/Node matrix entries. macos-latest (Apple Silicon)
    # repeatedly cancelled only the Node 24 job before assigning a runner;
    # macos-15-intel is a supported standard hosted runner (no larger runner).
    runs-on: ${{ matrix.os == 'macos-latest' && matrix.node == '24' && 'macos-15-intel' || matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Use npm with fixed peer-dependency resolver
        run: npm install --global npm@11.19.1
      - name: Reproducible dependency installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm audit --audit-level=high
      - name: Install actual Claude Code CLI
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm install --global @anthropic-ai/claude-code
      - name: Verify package and run regression tests
        run: npm run check
      - name: Verify generated distribution is committed
        run: npm run check:dist
      - name: Inspect npm tarball
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm pack --dry-run --ignore-scripts
      - name: Run real Claude Code CLI to MCP stdio server smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: node scripts/claude-mcp-smoke.mjs
