name: Feature request
description: Suggest a Canary assertion, reporter or workflow
title: "[feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which regression-testing problem should Canary solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Show desired CLI or scenario syntax if possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
