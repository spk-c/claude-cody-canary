name: Live Claude Code E2E (authenticated)

on:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        description: Live scenario scope (requires ANTHROPIC_API_KEY secret)
        required: true
        default: core
        options: [core, full]

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require explicit provider credentials
        shell: bash
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY repository secret is required for authenticated E2E."
            exit 1
          fi
      - name: Install dependencies and build
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: Install actual Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code
      - name: Confirm Claude Code version
        run: claude --version
      - name: Execute real provider and plugin smoke checks in disposable Git worktrees
        run: node scripts/live-e2e.mjs ${{ inputs.suite }}
