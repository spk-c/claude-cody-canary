name: JavaScript distribution CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Reproducible dependency installation
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm audit --omit=dev --audit-level=high
      - name: Emit updated lockfile for review
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        shell: bash
        run: |
          echo CANARY_LOCK_BEGIN
          cat package-lock.json
          echo CANARY_LOCK_END
      - name: Verify package and run regression tests
        run: npm run check
