name: Claude Canary — release compare

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Compare Claude Code releases
        uses: spk-c/claude-cody-canary@e118e3705c919d29ea16b3878888484db53dd14d # v2.2.0
        with:
          mode: compare
          scenario: .canary/basic.canary.yml
          from: 2.1.220
          to: latest
          upload-results: "true"
