name: macOS Apple Silicon compatibility

on:
  workflow_dispatch:
  schedule:
    # Apple Silicon availability varies; separate from release gates.
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  verify-arm:
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Match pinned npm used by release tests
        run: npm install --global npm@11.19.1
      - name: Install exactly locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate source, security and distribution
        run: npm run check && npm run check:dist
