name: Publish CI-verified GitHub Release
run-name: Release ${{ inputs.version || github.ref_name }}

on:
  # One-time exact-tag release: still validates main identity, rebuilds and audits.
  # Future releases remain manually approved through workflow_dispatch.
  push:
    tags: ['v2.4.0']
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: Version with or without v prefix (2.1.1 or v2.1.1)
        type: string
      confirmation:
        required: true
        description: Type PUBLISH to confirm the immutable release
        type: string

permissions:
  contents: write
  actions: write  # Dispatch the existing OIDC npm workflow after a verified v2.4.0 release.
  attestations: write
  id-token: write

concurrency:
  group: claude-canary-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Use same npm version as source CI
        run: npm install --global npm@11.19.1
      - name: Validate and normalize manual release request before accessing credentials
        id: release_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            test "$GITHUB_REF" = 'refs/tags/v2.4.0' || { echo 'Only approved v2.4.0 tag can auto-publish'; exit 1; }
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA" || { echo 'Release tag must point exactly at main HEAD'; exit 1; }
            node scripts/normalize-release-version.mjs v2.4.0 >> "$GITHUB_OUTPUT"
          else
            test "$GITHUB_REF" = 'refs/heads/main' || { echo 'Only main can publish'; exit 1; }
            test "$INPUT_CONFIRMATION" = PUBLISH || { echo 'Explicit PUBLISH confirmation required'; exit 1; }
            node scripts/normalize-release-version.mjs "$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo 'Checkout SHA mismatch'; exit 1; }
      - name: Rebuild and verify source and npm packaging
        run: |
          npm ci --ignore-scripts --no-fund
          npm run check
          npm run check:dist
          npm audit --audit-level=high
          npm pack --dry-run --ignore-scripts
      - name: Build release archive and checksums
        shell: bash
        run: |
          mkdir -p release-assets
          npm pack --ignore-scripts --pack-destination release-assets
          cd release-assets
          sha256sum *.tgz > SHA256SUMS
      - name: Verify exact release asset in a clean consumer before publishing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-consumer"
          VERSION="$(node -p "require('./package.json').version")"
          npm install --prefix "$RUNNER_TEMP/release-consumer" \
            "$GITHUB_WORKSPACE/release-assets/claude-code-canary-${VERSION}.tgz" \
            --ignore-scripts --no-audit --no-fund
          cp tests/fixtures/package-consumer-smoke.mjs "$RUNNER_TEMP/release-consumer/smoke.mjs"
          node "$RUNNER_TEMP/release-consumer/smoke.mjs"
      - name: Attest release archive build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release-assets/*.tgz
      - name: Create immutable release tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > "$RUNNER_TEMP/canary-tag.json" 2>/dev/null; then
            OBJECT_SHA="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).object.sha" "$RUNNER_TEMP/canary-tag.json")"
            test "$OBJECT_SHA" = "$GITHUB_SHA" || { echo 'Existing tag points to another SHA; refusing to overwrite.'; exit 1; }
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite."
          else
            gh release create "$TAG" release-assets/* --verify-tag --target "$GITHUB_SHA" \
              --title "Claude Code Canary $TAG" --generate-notes
          fi
      - name: Request npm Trusted Publishing from its dedicated OIDC workflow
        if: github.event_name == 'push' && github.ref == 'refs/tags/v2.4.0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # This workflow publishes GitHub assets first. npm-publish.yml then independently
          # verifies the immutable tag, checksums, consumer install and OIDC identity.
          gh workflow run npm-publish.yml --ref main --field version=2.4.0 --field confirmation=PUBLISH_NPM
