name: JavaScript distribution CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Reproducible dependency installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm audit --omit=dev --audit-level=high
      - name: Install actual Claude Code CLI
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm install --global @anthropic-ai/claude-code
      - name: Verify package and run regression tests
        run: npm run check
      - name: Run real Claude Code CLI to MCP stdio server smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: node scripts/claude-mcp-smoke.mjs
