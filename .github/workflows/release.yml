name: Publish CI-verified GitHub Release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: Version with or without v prefix (2.1.1 or v2.1.1)
        type: string
      confirmation:
        required: true
        description: Type PUBLISH to confirm the immutable release
        type: string

permissions:
  contents: write
  actions: read
  attestations: write
  id-token: write

concurrency:
  group: claude-canary-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Use same npm version as source CI
        run: npm install --global npm@11.19.1
      - name: Validate and normalize manual release request before accessing credentials
        id: release_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          test "$GITHUB_REF" = 'refs/heads/main' || { echo 'Only main can publish'; exit 1; }
          test "$INPUT_CONFIRMATION" = PUBLISH || { echo 'Explicit PUBLISH confirmation required'; exit 1; }
          node scripts/normalize-release-version.mjs "$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo 'Checkout does not match dispatched main commit'; exit 1; }
      - name: Rebuild and verify source and npm packaging
        run: |
          npm ci --ignore-scripts --no-fund
          npm run check
          npm run check:dist
          npm audit --audit-level=high
          npm pack --dry-run --ignore-scripts
      - name: Build release archive and checksums
        shell: bash
        run: |
          mkdir -p release-assets
          npm pack --ignore-scripts --pack-destination release-assets
          cd release-assets
          sha256sum *.tgz > SHA256SUMS
      - name: Attest release archive build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*.tgz
      - name: Create immutable release tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > "$RUNNER_TEMP/canary-tag.json" 2>/dev/null; then
            OBJECT_SHA="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).object.sha" "$RUNNER_TEMP/canary-tag.json")"
            test "$OBJECT_SHA" = "$GITHUB_SHA" || { echo 'Existing tag points to another SHA; refusing to overwrite.'; exit 1; }
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite."
          else
            gh release create "$TAG" release-assets/* --verify-tag --target "$GITHUB_SHA" \
              --title "Claude Code Canary $TAG" --generate-notes
          fi
