name: Source and security CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22', '24']
        # Keep the original nine combinations, selecting stable supported
        # standard macOS runners where the macos-latest queue stalled.
        # Keep both Apple Silicon (Node 20) and Intel (Node 22/24),
        # covering macOS 15 and macOS 26.
        include:
          - os: macos-latest
            node: '20'
            runner: macos-15
          - os: macos-latest
            node: '22'
            runner: macos-26-intel
          - os: macos-latest
            node: '24'
            runner: macos-15-intel
    runs-on: ${{ matrix.runner || matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Use npm with fixed peer-dependency resolver
        run: npm install --global npm@11.19.1
      - name: Reproducible dependency installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm audit --audit-level=high
      - name: Install actual Claude Code CLI
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm install --global @anthropic-ai/claude-code
      - name: Verify package and run regression tests
        run: npm run check
      - name: Verify generated distribution is committed
        run: npm run check:dist
      - name: Inspect npm tarball
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm pack --dry-run --ignore-scripts
      - name: Run real Claude Code CLI to MCP stdio server smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: node scripts/claude-mcp-smoke.mjs
