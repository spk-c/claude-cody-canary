name: Live Claude Code E2E (authenticated)
run-name: Live Claude E2E (${{ inputs.suite }})

on:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        description: Live scenario scope (requires ANTHROPIC_API_KEY secret)
        required: true
        default: core
        options: [core, full]

permissions:
  contents: read

concurrency:
  group: claude-canary-live-e2e
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse execution on non-default branch
        shell: bash
        env:
          REQUEST_REF: ${{ github.ref }}
        run: |
          if [ "$REQUEST_REF" != "refs/heads/main" ]; then
            echo "::error::Run authenticated E2E only from the protected/default main branch."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies, build and validate safety tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm run test:live-safety
      - name: Install actual Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code
      - name: Confirm Claude Code version
        run: claude --version
      - name: Execute model-backed E2E in an isolated fixture
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CANARY_E2E_KEEP: '0'
          REQUESTED_SUITE: ${{ inputs.suite }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY GitHub Actions secret is required; no live model call was made."
            exit 1
          fi
          node scripts/live-e2e.mjs "$REQUESTED_SUITE"
      - name: Upload sanitized E2E result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-claude-e2e-results
          path: .canary/results/
          if-no-files-found: ignore
          retention-days: 7
