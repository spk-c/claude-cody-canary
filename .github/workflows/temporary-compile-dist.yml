name: Temporary committed dist synchronization
on:
  push:
    branches: [perf/fast-suite-discovery-identity-20261101]
    paths: [.github/workflows/temporary-compile-dist.yml]
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install and compile
        run: |
          npm install --global npm@11.19.1
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Commit only generated dist assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if ! git diff --cached --quiet; then
            git commit -m "build(dist): synchronize fast suite discovery"
            git push origin HEAD:refs/heads/perf/fast-suite-discovery-identity-20261101
          fi
