name: Claude Canary — plugin compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Test plugin across recent Claude Code releases
        uses: spk-c/claude-cody-canary@e118e3705c919d29ea16b3878888484db53dd14d # v2.2.0
        with:
          mode: plugin-suite
          plugin: ./my-plugin
          last: 10
          max-runs: 200
          fail-on-incompatible: "true"
